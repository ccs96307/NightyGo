name: Build desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            archive: NightyGo-linux-x86_64.tar.gz
          - os: windows-latest
            name: windows-x64
            archive: NightyGo-windows-x64.zip
          - os: macos-15
            name: macos-arm64
            archive: NightyGo-macos-arm64.zip
          - os: macos-15-intel
            name: macos-x86_64
            archive: NightyGo-macos-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked application dependencies
        run: uv sync --locked

      - name: Package application on Unix
        if: runner.os != 'Windows'
        run: >-
          uv run --with pyinstaller pyinstaller --noconfirm --clean --windowed --onedir
          --name NightyGo
          --add-data "nightygo/assets:nightygo/assets"
          --add-data "nightygo/qml:nightygo/qml"
          main.py

      - name: Package application on Windows
        if: runner.os == 'Windows'
        run: >-
          uv run --with pyinstaller pyinstaller --noconfirm --clean --windowed --onedir
          --name NightyGo
          --add-data "nightygo/assets;nightygo/assets"
          --add-data "nightygo/qml;nightygo/qml"
          main.py

      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: tar -C dist -czf "${{ matrix.archive }}" NightyGo

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/NightyGo -DestinationPath "${{ matrix.archive }}"

      - name: Create macOS archive
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/NightyGo.app "${{ matrix.archive }}"

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nightygo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.12.0",
]

[project.scripts]
nightygo = "nightygo.app:main"

[tool.hatch.build.targets.wheel]
packages = ["nightygo"]
